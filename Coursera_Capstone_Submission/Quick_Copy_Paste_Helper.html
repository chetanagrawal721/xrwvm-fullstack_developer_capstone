      color: #0043ce;

      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .task-card:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .task-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #002d9c;
    }
    .task-points {
      background: #edf5ff;
      color: #0043ce;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .question {
      font-size: 0.95rem;
      color: #393939;
      margin-bottom: 1rem;
      font-weight: 500;
    }
    .answer-box {
      background: #f4f4f4;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      padding: 1rem;
      font-family: Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 0.88rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 1rem;
      position: relative;
    }
    .btn-copy {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.15s ease;
    }
    .btn-copy:hover {
      background: var(--primary-hover);
    }
    .btn-copy.copied {
      background: var(--success);
    }
    .image-preview {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: #fafafa;
      border: 1px dashed #c6c6c6;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .image-preview img {
      max-width: 220px;
      max-height: 120px;
      border-radius: 4px;
      border: 1px solid #ddd;
      object-fit: cover;
    }
    .image-info {
      font-size: 0.9rem;
    }
    .image-info code {
      background: #e0e0e0;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
      color: #000;
      font-weight: bold;
    }

    const container = document.getElementById("tasks-container");

    tasks.forEach((t) => {
      const card = document.createElement("div");
      card.className = "task-card";

      let bodyHtml = "";
      if (t.type === "text") {
        const uniqueId = "ans_" + String(t.num).replace(/[^a-zA-Z0-9]/g, "_");
        bodyHtml = `
          <div class="answer-box" id="${uniqueId}">${escapeHtml(t.answer)}</div>
          <button class="btn-copy" onclick="copyAnswer('${uniqueId}', this)">
            <span>📋 Copy Answer</span>
          </button>
        `;
      } else {
        bodyHtml = `
          <div class="image-preview">
            <img src="./screenshots/${t.filename}" alt="${t.filename}">
            <div class="image-info">
              <p>Upload this file to Coursera:</p>
              <code>${t.filename}</code>
              <p style="margin-top: 0.5rem; color: #555; font-size: 0.85rem;">Located in <strong>screenshots/${t.filename}</strong></p>
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="task-header">
          <span class="task-title">Task ${t.num}</span>
          <span class="task-points">${t.points} Point${t.points > 1 ? 's' : ''}</span>
        </div>
        <div class="question">${t.question}</div>
        ${bodyHtml}
      `;
      container.appendChild(card);
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function copyAnswer(elementId, btn) {
      const text = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = "<span>✓ Copied!</span>";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove("copied");
        }, 1800);
      }).catch(err => {
        alert("Failed to copy automatically: " + err);
      });
    }
  </script>
