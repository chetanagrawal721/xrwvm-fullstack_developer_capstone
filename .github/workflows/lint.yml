name: Lint Code

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Print working directory
        run: pwd

      - name: Run Linter
        run: |
          flake8 server/djangoapp --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 server/djangoapp --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  lint_javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JSHint
        run: npm install -g jshint

      - name: Run Linter
        run: |
          node --check server/database/app.js
          node --check server/database/dealership.js
          node --check server/database/review.js
          node --check server/database/inventory.js
          jshint --config .jshintrc server/database/app.js || true
